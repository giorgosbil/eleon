ServerName localhost
<VirtualHost *:80>
    DocumentRoot /var/www/html
    Alias /other_things/web/ /opt/ecw/web/
    Alias /other_things/cad_viewer/ /opt/ecw/cad_viewer/
    <Directory /opt/ecw>
        Require all denied
    </Directory>
    <Directory /opt/ecw/web>
        Require all granted
        Options -Indexes
        AllowOverride None
        DirectoryIndex index.php
        # Installable app: the manifest's type, and a service worker that is
        # always re-checked so app updates reach phones.
        AddType application/manifest+json .webmanifest
        <Files "sw.js">
            Header set Cache-Control "no-cache"
            Header set Service-Worker-Allowed "/other_things/web/"
        </Files>
    </Directory>
    <Directory /opt/ecw/cad_viewer>
        Require all granted
        Options -Indexes
        AllowOverride None
        <FilesMatch "\.php$">
            Require all denied
        </FilesMatch>
    </Directory>
    # Do not log OAuth codes or invitation tokens in URL query strings.
    LogFormat "%h %t %m %U %>s %b" ecw
    CustomLog /proc/self/fd/1 ecw
    ErrorLog /proc/self/fd/2
</VirtualHost>
